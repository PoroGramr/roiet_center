spring:
  application:
    name: roiet-center-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roiet}
    username: ${DB_USERNAME:roiet}
    password: ${DB_PASSWORD:roiet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:3000}
  attendance:
    late-counts-as-present: true
    early-leave-counts-as-present: true
  alerts:
    consecutive-absences: 3
    recent-session-window: 5
    absences-in-window: 3
    inactive-days: 14

