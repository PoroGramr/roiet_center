spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-testing
    expiration-minutes: 60
  cors:
    allowed-origin: http://localhost:3000
  attendance:
    late-counts-as-present: true
    early-leave-counts-as-present: true
  alerts:
    consecutive-absences: 3
    recent-session-window: 5
    absences-in-window: 3
    inactive-days: 14

