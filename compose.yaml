services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roiet
      POSTGRES_USER: roiet
      POSTGRES_PASSWORD: roiet
    ports:
      - "5432:5432"
    volumes:
      - roiet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roiet -d roiet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  roiet-postgres:

