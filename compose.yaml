name: roiet-center

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - roiet-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      FRONTEND_URL: ${FRONTEND_URL:-https://roiet.porogramr.com}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - roiet-net

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - roiet-net
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.roiet.rule=Host(`roiet.porogramr.com`)"
      - "traefik.http.routers.roiet.entrypoints=websecure"
      - "traefik.http.routers.roiet.tls=true"
      - "traefik.http.routers.roiet.tls.certresolver=letsencrypt"
      - "traefik.http.routers.roiet.service=roiet"
      - "traefik.http.services.roiet.loadbalancer.server.port=3000"
      - "traefik.http.routers.roiet-http.rule=Host(`roiet.porogramr.com`)"
      - "traefik.http.routers.roiet-http.entrypoints=web"
      - "traefik.http.routers.roiet-http.middlewares=roiet-https-redirect"
      - "traefik.http.middlewares.roiet-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.roiet-https-redirect.redirectscheme.permanent=true"

networks:
  roiet-net:
    driver: bridge
  web:
    external: true
